name: Admin checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/admin-editor-draft]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check admin/admin.js
          node --check shared.js
          node --check site.js
      - name: Run editor regression test
        run: node tests/admin-regression.cjs
